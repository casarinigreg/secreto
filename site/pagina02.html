<body>

<script>
    function quest1() {
        let resposta = slc_quest1.value;

        if(resposta == 1) {

        } else if(resposta == 2) {
            div_result.innerHTML=`<a href="pagina03.html">BOA MEU AMOR!!!</a>
            `

</script>
